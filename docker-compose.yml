services:
  backend:
    build:
      context: ./backend
    container_name: rixin-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override host/port for container networking
      - HOST=0.0.0.0
      - PORT=8000
      - STORAGE_DIR=/data/storage
      - QUALITY_CASES_DIR=/data/storage/quality/cases
      - QUALITY_RUNS_DIR=/data/storage/quality/runs
      - QUALITY_CASES_SEED_DIR=/app/resources/quality_cases
      - RELOAD=false
      - API_WORKERS=1
      - FRONTEND_CORS_ORIGINS=http://localhost,http://127.0.0.1
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage_data:/data/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/contract}
        VITE_API_BASE_PATH: ${VITE_API_BASE_PATH:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
        VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-}
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${VITE_OIDC_POST_LOGOUT_REDIRECT_URI:-}
        VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-}
    container_name: rixin-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_ADDR:-127.0.0.1}:${FRONTEND_HOST_PORT:-18080}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  storage_data:
    driver: local
