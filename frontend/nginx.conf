# Nginx config for contract comparison frontend
# Serves React SPA + proxies /api/ and /health to backend

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Explicit MIME type mapping for JS modules; nginx:alpine's default
    # mime.types covers regular static assets but does not include .mjs.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # Same app under the configured public prefix. This makes the container
    # usable both behind an outer Nginx that strips /contract and directly at
    # http://127.0.0.1:18080/ when Vite assets are built with /contract/.
    location = /contract {
        return 301 /contract/;
    }

    location = /contract/health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location ^~ /contract/api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 80m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location = /contract/favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
    }

    location ^~ /contract/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /contract/ {
        try_files $uri $uri/ /index.html;
    }

    # SPA routing: fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # File upload limits
        client_max_body_size 80m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # Health check proxy
    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Static asset caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Compress responses
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;
    gzip_min_length 1000;
}
